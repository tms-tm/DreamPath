<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamPath — Career Exploration Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --surface: #FBF9F2;
      --surface-low: #F6F4ED;
      --surface-container: #F0EEE7;
      --surface-high: #EAE8E1;
      --surface-highest: #E4E2DC;
      --white: #FFFFFF;
      --hairline: #E8E5DC;
      --outline: #74777D;
      --outline-variant: #C4C6CD;
      --on-surface: #1B1C18;
      --on-surface-variant: #43474C;
      --sky: #CFE2FA;
      --sky-hover: #B5C8E0;
      --sky-light: #D1E4FC;
      --navy-text: #091D2E;
      --royal: #1E3A8A;
      --sky-accent: #60A5FA;
      --slate: #4E6074;
      --mint: #D3E8DA;
      --mint-text: #0D1F17;
      --mint-strong: #2E6F49;
      --sun: #FDF1D2;
      --sun-text: #7A5C1B;
      --blush: #F3DAE7;
      --blush-text: #53424C;
      --blush-strong: #7E3B5E;
      --peach: #FBE3DC;
      --peach-text: #8A3A1E;
      --error-bg: #FFDAD6;
      --error-text: #93000A;
      --shadow-xs: 0 1px 3px 0 rgba(42, 36, 27, 0.04), 0 1px 2px -1px rgba(42, 36, 27, 0.02);
      --shadow-card: 0 8px 20px -4px rgba(40, 30, 20, 0.05), 0 2px 6px -2px rgba(40, 30, 20, 0.03);
      --shadow-float: 0 16px 36px -6px rgba(30, 25, 20, 0.12), 0 6px 12px -3px rgba(30, 25, 20, 0.06);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--surface);
      color: var(--on-surface);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 14px;
      line-height: 22px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input {
      font-family: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--sky-accent);
      outline-offset: 2px;
    }

    /* Ambient background blobs */
    .bg-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      opacity: 0.35;
    }

    .blob-peach {
      width: 380px;
      height: 380px;
      background: var(--peach);
      top: -90px;
      right: -80px;
    }

    .blob-mint {
      width: 360px;
      height: 360px;
      background: var(--mint);
      bottom: -100px;
      left: -80px;
    }

    .blob-blush {
      width: 300px;
      height: 300px;
      background: var(--blush);
      top: 42%;
      left: 55%;
    }

    /* Main single column shell */
    .shell {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 32px 64px;
    }

    @media (max-width: 639px) {
      .shell {
        padding: 20px 16px 48px;
      }
    }

    /* Top bar */
    .topbar {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 28px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--on-surface);
      font-weight: 700;
      font-size: 22px;
      line-height: 28px;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--royal);
    }

    .step-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      background: var(--white);
      border: 1px solid var(--hairline);
      padding: 6px 12px;
      border-radius: 9999px;
      box-shadow: var(--shadow-xs);
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-dot {
      height: 8px;
      width: 8px;
      border-radius: 9999px;
      background: var(--surface-highest);
      transition: width 280ms ease, background-color 280ms ease;
    }

    .step-dot.completed {
      background: var(--royal);
    }

    .step-dot.current {
      width: 24px;
      background: var(--sky-accent);
    }

    /* Step container animation */
    .step-view {
      animation: stepEnter 280ms ease forwards;
    }

    @keyframes stepEnter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Typography scale */
    .display-title {
      font-size: 44px;
      line-height: 52px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
      color: var(--on-surface);
    }

    @media (max-width: 639px) {
      .display-title {
        font-size: 32px;
        line-height: 40px;
      }
    }

    .headline-lg {
      font-size: 32px;
      line-height: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      color: var(--on-surface);
    }

    @media (max-width: 639px) {
      .headline-lg {
        font-size: 26px;
        line-height: 34px;
      }
    }

    .headline-md {
      font-size: 24px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0 0 8px;
      color: var(--on-surface);
    }

    .headline-sm {
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--on-surface);
    }

    .title-md {
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      margin: 0;
      color: var(--on-surface);
    }

    .body-lg {
      font-size: 16px;
      line-height: 26px;
      font-weight: 400;
      color: var(--on-surface-variant);
      margin: 0;
    }

    .body-md {
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      color: var(--on-surface-variant);
      margin: 0;
    }

    .body-sm {
      font-size: 13px;
      line-height: 18px;
      font-weight: 400;
      color: var(--on-surface-variant);
      margin: 0;
    }

    .label-sm {
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Cards & Hero Cards */
    .card {
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-xs);
    }

    @media (max-width: 639px) {
      .card {
        padding: 16px;
      }
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #FBE3DC 0%, #F8DFEC 100%);
      border: 1px solid var(--hairline);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow-card);
    }

    @media (max-width: 639px) {
      .hero-card {
        padding: 20px;
      }
    }

    .hero-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .hero-circle-1 {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 70%);
      top: -60px;
      right: -40px;
    }

    .hero-circle-2 {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 9999px;
      border: 1.5px dashed rgba(138, 58, 30, 0.16);
      top: 16px;
      right: 24px;
    }

    .hero-sparkle-1 {
      position: absolute;
      top: 26px;
      right: 48px;
      color: var(--sun-text);
      opacity: 0.55;
    }

    .hero-sparkle-2 {
      position: absolute;
      top: 72px;
      right: 112px;
      color: var(--royal);
      opacity: 0.4;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    /* Eyebrow pill */
    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      border: 1px solid var(--hairline);
      color: var(--peach-text);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
      box-shadow: var(--shadow-xs);
    }

    .eyebrow-pill.sky {
      color: var(--royal);
    }

    /* Inner white form box inside hero */
    .form-panel {
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 24px;
      padding: 24px;
      margin-top: 24px;
      box-shadow: var(--shadow-xs);
    }

    @media (max-width: 639px) {
      .form-panel {
        padding: 16px;
      }
    }

    /* Segmented tabs */
    .tablist {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-container);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: var(--on-surface-variant);
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .tab-btn:hover {
      color: var(--on-surface);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--white);
      color: var(--on-surface);
      font-weight: 700;
      box-shadow: var(--shadow-xs);
    }

    /* Form fields */
    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      color: var(--on-surface);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      line-height: 22px;
      color: var(--on-surface);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .text-input.has-toggle {
      padding-right: 44px;
    }

    .text-input::placeholder {
      color: var(--outline);
    }

    .text-input:focus {
      outline: none;
      border-color: var(--royal);
      box-shadow: 0 0 0 3px rgba(207, 226, 250, 0.7);
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--on-surface-variant);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .pw-toggle:hover {
      background: var(--surface-low);
      color: var(--on-surface);
    }

    .error-msg {
      margin-top: 6px;
      background: var(--error-bg);
      color: var(--error-text);
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      border-radius: 8px;
      padding: 6px 12px;
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--sky);
      color: var(--navy-text);
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: background-color 160ms ease, transform 120ms ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--sky-hover);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary:disabled {
      background: var(--surface-high);
      color: var(--outline);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-full {
      width: 100%;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--white);
      border: 1px solid var(--hairline);
      color: var(--on-surface);
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .btn-secondary:hover {
      background: var(--surface-low);
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--royal);
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

    .demo-row {
      margin-top: 16px;
      text-align: center;
    }

    .privacy-note {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      color: var(--outline);
    }

    /* Icon tiles */
    .icon-tile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .tile-40 { width: 40px; height: 40px; }
    .tile-48 { width: 48px; height: 48px; }
    .tile-56 { width: 56px; height: 56px; }

    .tone-mint { background: var(--mint); color: var(--mint-strong); }
    .tone-sun { background: var(--sun); color: var(--sun-text); }
    .tone-blush { background: var(--blush); color: var(--blush-strong); }
    .tone-sky { background: var(--sky-light); color: var(--royal); }
    .tone-peach { background: var(--peach); color: var(--peach-text); }

    /* Step 2: Level cards */
    .section-block {
      margin-top: 24px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 639px) {
      .level-grid {
        grid-template-columns: 1fr;
      }
    }

    .select-card {
      position: relative;
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .select-card:hover {
      border-color: var(--sky-light);
      box-shadow: var(--shadow-card);
    }

    .select-card.selected {
      border: 2px solid var(--sky-accent);
      background: #EEF5FD;
      padding: 17px 15px;
    }

    .check-corner {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background: var(--royal);
      color: var(--white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Multi-select chips */
    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      border: 1px solid var(--hairline);
      color: var(--royal);
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, opacity 160ms ease;
    }

    .chip-btn:hover:not(.chip-disabled):not(.selected) {
      background: rgba(207, 226, 250, 0.3);
      border-color: var(--sky);
    }

    .chip-btn.selected {
      background: var(--sky);
      border-color: var(--royal);
      color: var(--navy-text);
    }

    .chip-btn.chip-disabled {
      opacity: 0.5;
      cursor: pointer;
    }

    /* Status pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
    }

    .pill-mint { background: var(--mint); color: var(--mint-text); }
    .pill-sun { background: var(--sun); color: var(--sun-text); }
    .pill-blush { background: var(--blush); color: var(--blush-text); }
    .pill-sky { background: var(--sky-light); color: var(--royal); }
    .pill-neutral { background: var(--surface-container); color: var(--on-surface); }
    .pill-white { background: var(--white); color: var(--on-surface); border: 1px solid var(--hairline); }

    .hint-banner {
      margin-top: 12px;
    }

    /* Footer bar */
    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--hairline);
    }

    /* Step 3 Hero + CSS Planet */
    .hero-split {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .hero-text-col {
      flex: 1;
      min-width: 0;
    }

    .planet-wrap {
      position: relative;
      width: 164px;
      height: 164px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 639px) {
      .planet-wrap {
        display: none;
      }
    }

    .planet-sphere {
      width: 104px;
      height: 104px;
      border-radius: 9999px;
      background: radial-gradient(circle at 32% 28%, #F9A8D4 0%, #C084FC 52%, #60A5FA 100%);
      box-shadow: inset -12px -14px 24px rgba(30, 58, 138, 0.25), 0 10px 24px rgba(126, 59, 94, 0.18);
      position: relative;
      z-index: 2;
    }

    .planet-ring {
      position: absolute;
      width: 158px;
      height: 44px;
      border-radius: 9999px;
      border: 7px solid transparent;
      background: linear-gradient(90deg, #FB923C, #FACC15, #4ADE80) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      transform: rotate(-22deg);
      z-index: 3;
    }

    .planet-star-1 {
      position: absolute;
      top: 10px;
      right: 14px;
      color: var(--sun-text);
      z-index: 4;
    }

    .planet-star-2 {
      position: absolute;
      bottom: 14px;
      left: 12px;
      color: var(--royal);
      z-index: 4;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    @media (max-width: 639px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    .stat-tile {
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-xs);
    }

    .recap-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(27, 28, 24, 0.08);
    }

    .hero-cta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    /* Step 4 Quiz */
    .quiz-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--surface-high);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #CFE2FA, #60A5FA);
      border-radius: 9999px;
      transition: width 400ms ease;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    @media (max-width: 559px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-card {
      position: relative;
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: var(--shadow-xs);
      transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .option-card:hover {
      border-color: var(--sky-light);
      box-shadow: var(--shadow-card);
    }

    .option-card.selected {
      border: 2px solid var(--sky-accent);
      background: #EEF5FD;
      padding: 17px 15px;
    }

    .option-label {
      padding-right: 22px;
    }

    /* Interstitial loader */
    .matching-box {
      padding: 56px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .spinner-ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 5px solid var(--surface-high);
      border-top-color: var(--sky-accent);
      border-right-color: var(--blush-strong);
      animation: spinRing 1s linear infinite;
    }

    .spinner-center {
      color: var(--royal);
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Step 5 Career cards */
    .results-header {
      margin-bottom: 22px;
    }

    .careers-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .career-card {
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .career-card:hover {
      border-color: var(--sky-light);
      box-shadow: var(--shadow-card);
      transform: translateY(-2px);
    }

    .career-band {
      position: relative;
      height: 88px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .band-0 { background: linear-gradient(135deg, #D3E8DA 0%, #CFE2FA 100%); }
    .band-1 { background: linear-gradient(135deg, #D1E4FC 0%, #F3DAE7 100%); }
    .band-2 { background: linear-gradient(135deg, #FDF1D2 0%, #FBE3DC 100%); }

    .band-deco-1 {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.35);
      right: -20px;
      top: -30px;
      pointer-events: none;
    }

    .band-deco-2 {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.28);
      right: 85px;
      bottom: -35px;
      pointer-events: none;
    }

    .career-icon-box {
      position: relative;
      z-index: 1;
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--white);
      color: var(--royal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-card);
    }

    .rank-badge {
      position: relative;
      z-index: 1;
    }

    .career-body {
      padding: 22px 24px 24px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 639px) {
      .career-body {
        grid-template-columns: 1fr;
        padding: 18px 16px 20px;
      }
    }

    .why-strip {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 12px;
      background: rgba(253, 241, 210, 0.6);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--on-surface);
    }

    .why-icon {
      color: var(--sun-text);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .match-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .mini-track {
      flex: 1;
      height: 8px;
      background: var(--surface-high);
      border-radius: 9999px;
      overflow: hidden;
    }

    .mini-fill {
      height: 100%;
      background: linear-gradient(90deg, #CFE2FA, #60A5FA);
      border-radius: 9999px;
    }

    .career-meta-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .salary-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface-container);
      color: var(--on-surface);
      padding: 5px 10px;
      border-radius: 9999px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .career-footer {
      grid-column: 1 / -1;
      padding-top: 14px;
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: flex-end;
    }

    @media (max-width: 639px) {
      .career-footer .btn-primary {
        width: 100%;
      }
    }

    .results-bottom {
      margin-top: 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Confirmation screen (step = 'done') */
    .confirm-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 32px;
    }

    .confirm-header {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .confirm-header .eyebrow-pill {
      margin-bottom: 16px;
    }

    .confirm-header .display-title {
      margin-bottom: 12px;
    }

    .confirm-card {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    @media (max-width: 479px) {
      .confirm-card {
        flex-direction: column;
        padding: 20px;
      }
    }

    .confirm-card-body {
      flex: 1;
      min-width: 0;
    }

    .confirm-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .confirm-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    @media (max-width: 479px) {
      .confirm-actions {
        flex-direction: column;
      }
      .confirm-actions .btn-primary,
      .confirm-actions .btn-secondary {
        width: 100%;
      }
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--white);
      border: 1px solid var(--hairline);
      color: var(--on-surface);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: var(--shadow-float);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      max-width: calc(100vw - 32px);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      background: var(--mint);
      color: var(--mint-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    function buildWhyLine(career, userTraits, selectedSubjs) {
      const matchedSubjects = selectedSubjs
        .map((s, idx) => ({ name: s, weight: career.subj[s] || 0, idx }))
        .filter(item => item.weight > 0)
        .sort((a, b) => (b.weight !== a.weight ? b.weight - a.weight : a.idx - b.idx))
        .slice(0, 2)
        .map(item => item.name);

      const careerTraitKeys = Object.keys(career.trait);
      let topTrait = careerTraitKeys[0] || "AN";
      let bestProduct = -1;
      careerTraitKeys.forEach(t => {
        const prod = (userTraits[t] || 0) * (career.trait[t] || 0);
        if (prod > bestProduct) {
          bestProduct = prod;
          topTrait = t;
        }
      });

      const phrase = TRAIT_PHRASE[topTrait] || TRAIT_PHRASE.AN;
      if (matchedSubjects.length === 2) {
        return `Fits your strength in ${matchedSubjects[0]} and ${matchedSubjects[1]}, plus your ${phrase}.`;
      }
      if (matchedSubjects.length === 1) {
        return `Fits your strength in ${matchedSubjects[0]}, plus your ${phrase}.`;
      }
      return `Fits your ${phrase} from the quiz.`;
    }

    function computeResults() {
      const userTraits = { AN: 0, CR: 0, SO: 0, BU: 0, EN: 0 };
      state.answers.forEach((ansIdx, qIdx) => {
        if (ansIdx === null || ansIdx === undefined) return;
        const opt = QUIZ[qIdx].o[ansIdx];
        if (!opt) return;
        userTraits[opt.p] = (userTraits[opt.p] || 0) + 2;
        userTraits[opt.s] = (userTraits[opt.s] || 0) + 1;
      });
      state.traits = { ...userTraits };

      const traitKeys = ["AN", "CR", "SO", "BU", "EN"];
      const scored = CAREERS.map((career, origIdx) => {
        let traitDot = 0;
        traitKeys.forEach(t => {
          traitDot += (userTraits[t] || 0) * (career.trait[t] || 0);
        });
        return { career, origIdx, traitDot };
      });

      const maxDot = scored.reduce((m, item) => Math.max(m, item.traitDot), 0);
      const selectedSubjs = state.subjects.length ? state.subjects : ["Mathematics", "Computing & Tech"];

      scored.forEach(item => {
        const traitNorm = maxDot > 0 ? item.traitDot / maxDot : 0;
        let subjectPts = 0;
        selectedSubjs.forEach(s => {
          subjectPts += item.career.subj[s] || 0;
        });
        const subjectNorm = subjectPts / (3 * selectedSubjs.length);
        const raw = Math.round(60 + 37 * (0.6 * traitNorm + 0.4 * subjectNorm));
        item.match = Math.max(60, Math.min(97, raw));
      });

      scored.sort((a, b) => {
        if (b.match !== a.match) return b.match - a.match;
        if (b.traitDot !== a.traitDot) return b.traitDot - a.traitDot;
        return a.origIdx - b.origIdx;
      });

      const top3 = scored.slice(0, 3).map(item => ({
        ...item.career,
        match: item.match,
        why: buildWhyLine(item.career, userTraits, selectedSubjs)
      }));

      for (let i = 1; i < top3.length; i++) {
        while (top3[i].match >= top3[i - 1].match) {
          top3[i].match -= 1;
        }
      }

      state.results = top3;
    }

            <div class="section-block">
              <div class="section-header-row">
                <h2 class="title-md">Pick your top 2–3 strengths or favourite subjects</h2>
                <span class="pill ${count >= 2 ? "pill-mint" : "pill-neutral"}">${count} of 3 selected</span>
              </div>
              <div class="chips-wrap" role="group" aria-label="Favourite subjects">
                ${chipsHtml}
              </div>
              ${ui.maxSubjectHint ? `
                <div class="hint-banner">
                  <span class="pill pill-sky">${icon("info", 14)} You can pick up to 3. Tap a selected one to swap.</span>
                </div>
              ` : ""}
            </div>

            <div class="footer-actions">
              <button type="button" class="btn-secondary" id="step2-back">
                ${icon("arrow-left", 18)}
                <span>Back</span>
              </button>
              <button type="button" class="btn-primary" id="step2-next" ${valid ? "" : "disabled"}>
                <span>Continue</span>
                ${icon("arrow-right", 18)}
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function renderStep3() {
      const subjectPills = state.subjects.map(s => `
        <span class="pill pill-white">${icon(subjectIcon(s), 14)} ${escapeHtml(s)}</span>
      `).join("");

      return `
        <section class="step-view">
          <div class="hero-card">
            <div class="hero-deco" aria-hidden="true">
              <div class="hero-circle-1"></div>
              <span class="hero-sparkle-1">${icon("sparkle", 20)}</span>
            </div>

            <div class="hero-content">
              <div class="hero-split">
                <div class="hero-text-col">
                  <div class="eyebrow-pill">${icon("sparkle", 14)} Career Galaxy Quiz</div>
                  <h1 class="display-title" tabindex="-1">Ready to find your future job?</h1>
                  <p class="body-lg">Take our quick 8-question personality and strengths quiz. We'll match your answers to the high-demand careers in Malaysia for 2026–2027, with real salary ranges and the skills you'll need.</p>
                </div>

                <div class="planet-wrap" aria-hidden="true">
                  <span class="planet-star-1">${icon("sparkle", 20)}</span>
                  <div class="planet-sphere"></div>
                  <div class="planet-ring"></div>
                  <span class="planet-star-2">${icon("sparkle", 16)}</span>
                </div>
              </div>

              <div class="stats-grid">
                <div class="stat-tile">
                  <span class="icon-tile tile-40 tone-sky">${icon("clock", 20)}</span>
                  <span class="title-md" style="font-size:14px;">About 2 minutes</span>
                </div>
                <div class="stat-tile">
                  <span class="icon-tile tile-40 tone-sun">${icon("puzzle", 20)}</span>
                  <span class="title-md" style="font-size:14px;">8 fun scenarios</span>
                </div>
                <div class="stat-tile">
                  <span class="icon-tile tile-40 tone-mint">${icon("target", 20)}</span>
                  <span class="title-md" style="font-size:14px;">Top 3 matches</span>
                </div>
              </div>

              <div class="recap-strip">
                <span class="label-sm" style="color:var(--on-surface-variant); margin-right:4px;">Your Profile:</span>
                <span class="pill pill-white">${icon("graduation-cap", 14)} ${escapeHtml(state.level || "Form 4–5")}</span>
                ${subjectPills}
              </div>

              <div class="hero-cta-row">
                <button type="button" class="btn-primary" id="start-quiz-btn">
                  <span>Start Personality Quiz</span>
                  ${icon("arrow-right", 18)}
                </button>
                <button type="button" class="btn-link" id="skip-quiz-btn">Skip to Dashboard</button>
              </div>
            </div>
          </div>

          <div style="margin-top:16px;">
            <button type="button" class="btn-link" id="step3-back">
              ${icon("arrow-left", 16)}
              <span>Back</span>
            </button>
          </div>
        </section>
      `;
    }

    function renderStep4() {
      if (ui.matching) {
        return `
          <section class="step-view">
            <div class="card matching-box">
              <div class="spinner-ring-wrap" aria-hidden="true">
                <div class="spinner-ring"></div>
                <span class="spinner-center">${icon("sparkle", 28)}</span>
              </div>
              <h1 class="headline-md" tabindex="-1">Matching your answers to 2026–2027 careers...</h1>
              <p class="body-md">Analysing your quiz scenarios and favourite subjects.</p>
            </div>
          </section>
        `;
      }

      const idx = state.quizIndex;
      const qObj = QUIZ[idx];
      const chosen = state.answers[idx];
      const answeredCurrent = chosen !== null && chosen !== undefined;
      const completedUnits = answeredCurrent ? idx + 1 : idx;
      const pct = Math.round((completedUnits / 8) * 100);
      const tones = ["tone-mint", "tone-sun", "tone-blush", "tone-sky"];

      const optionsHtml = qObj.o.map((opt, oIdx) => {
        const isSelected = chosen === oIdx;
        return `
          <button type="button"
            class="option-card ${isSelected ? "selected" : ""}"
            role="radio"
            aria-checked="${isSelected}"
            tabindex="${(chosen === null && oIdx === 0) || isSelected ? "0" : "-1"}"
            data-opt="${oIdx}">
            ${isSelected ? `<span class="check-corner" aria-hidden="true">${icon("check", 14)}</span>` : ""}
            <span class="icon-tile tile-48 ${tones[oIdx % 4]}">${icon(opt.i, 24)}</span>
            <span class="title-md option-label">${escapeHtml(opt.t)}</span>
          </button>
        `;
      }).join("");

      return `
        <section class="step-view">
          <div class="card">
            <div class="quiz-meta">
              <span class="label-sm" style="color:var(--royal);">Question ${idx + 1} of 8</span>
              <span class="label-sm" style="color:var(--on-surface-variant);">${pct}%</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>

            <h1 class="headline-md" tabindex="-1">${escapeHtml(qObj.q)}</h1>
            <p class="body-sm">Pick the one that sounds most like you.</p>

            <div class="options-grid" role="radiogroup" aria-label="Quiz options" id="quiz-options">
              ${optionsHtml}
            </div>

            <div class="footer-actions">
              <button type="button" class="btn-secondary" id="quiz-back">
                ${icon("arrow-left", 18)}
                <span>Back</span>
              </button>
              <button type="button" class="btn-primary" id="quiz-next" ${answeredCurrent ? "" : "disabled"}>
                <span>${idx === 7 ? "See My Matches" : "Next"}</span>
                ${icon("arrow-right", 18)}
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function renderStep5() {
      const subjs = state.subjects;
      let subjText = "";
      if (subjs.length === 1) {
        subjText = subjs[0];
      } else if (subjs.length === 2) {
        subjText = `${subjs[0]} and ${subjs[1]}`;
      } else if (subjs.length >= 3) {
        subjText = `${subjs[0]}, ${subjs[1]}, ${subjs[2]}`;
      }

      const cardsHtml = state.results.map((career, idx) => {
        const rankPill = idx === 0
          ? `<span class="pill pill-sun rank-badge">#1 Best Match</span>`
          : `<span class="pill pill-white rank-badge">#${idx + 1}</span>`;

        const skillsHtml = career.skills.map(sk => `
          <span class="skill-pill">${icon("check", 13)} ${escapeHtml(sk)}</span>
        `).join("");

        return `
          <article class="career-card">
            <div class="career-band band-${idx}">
              <div class="band-deco-1" aria-hidden="true"></div>
              <div class="band-deco-2" aria-hidden="true"></div>
              ${rankPill}
              <div class="career-icon-box">${icon(career.i, 40)}</div>
            </div>

            <div class="career-body">
              <div>
                <h2 class="headline-sm">${escapeHtml(career.title)}</h2>
                <p class="body-md" style="margin-top:6px;">${escapeHtml(career.desc)}</p>

                <div class="why-strip">
                  <span class="why-icon">${icon("lightbulb", 16)}</span>
                  <span class="body-sm" style="color:var(--on-surface);">${escapeHtml(career.why)}</span>
                </div>

                <div class="match-row">
                  <span class="pill pill-sky">${icon("target", 14)} ${career.match}% match</span>
                  <div class="mini-track" aria-hidden="true">
                    <div class="mini-fill" style="width:${career.match}%"></div>
                  </div>
                </div>
              </div>

              <div class="career-meta-col">
                <div class="salary-box">
                  <span class="body-sm" style="font-weight:600;">Starting salary</span>
                  <div>
                    <span class="pill pill-mint">${icon("credit-card", 14)} ${escapeHtml(career.salary)} / month</span>
                  </div>
                </div>

                <div>
                  ${demandBadge(career.demand)}
                </div>

                <div>
                  <div class="body-sm" style="font-weight:600; margin-bottom:6px;">Top 3 required skills</div>
                  <div class="skills-list">${skillsHtml}</div>
                </div>
              </div>

              <div class="career-footer">
                <button type="button" class="btn-primary" data-choose-career="${escapeHtml(career.id)}">
                  <span>Choose This Career</span>
                  ${icon("arrow-right", 18)}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      return `
        <section class="step-view">
          <div class="results-header">
            <div class="eyebrow-pill sky">${icon("sparkle", 14)} Your Results</div>
            <h1 class="headline-lg" tabindex="-1">Your Top 3 Career Matches, ${escapeHtml(firstName())}</h1>
            <p class="body-md">Based on your strengths in ${escapeHtml(subjText)} and your quiz answers. Data reflects the 2026–2027 Malaysian outlook.</p>
          </div>

          <div class="careers-stack">
            ${cardsHtml}
          </div>

          <div class="results-bottom">
            <p class="body-sm">Salary and demand figures are indicative estimates for entry-level roles in Malaysia (2026–2027).</p>
            <button type="button" class="btn-link" id="retake-quiz-btn">
              ${icon("refresh", 16)}
              <span>Retake the quiz</span>
            </button>
          </div>
        </section>
      `;
    }

    function renderDone() {
      const career = state.chosenCareer;
      const cardHtml = career ? `
        <div class="confirm-card">
          <span class="icon-tile tile-56 tone-sky">${icon(career.i, 28)}</span>
          <div class="confirm-card-body">
            <h2 class="headline-sm">${escapeHtml(career.title)}</h2>
            <p class="body-md" style="margin-top:6px;">${escapeHtml(career.desc)}</p>
            <div class="confirm-pills">
              <span class="pill pill-sky">${icon("target", 14)} ${career.match}% match</span>
              <span class="pill pill-mint">${icon("credit-card", 14)} ${escapeHtml(career.salary)} / month</span>
            </div>
          </div>
        </div>
      ` : `
        <div class="confirm-card">
          <span class="icon-tile tile-56 tone-sun">${icon("compass", 28)}</span>
          <div class="confirm-card-body">
            <h2 class="headline-sm">No career selected yet</h2>
            <p class="body-md" style="margin-top:6px;">You can take the personality quiz anytime from your Dashboard to unlock your career matches.</p>
          </div>
        </div>
      `;

      return `
        <section class="step-view">
          <div class="confirm-wrap">
            <div class="confirm-header">
              <div class="eyebrow-pill">${icon("sparkle", 14)} Confirm Your Path</div>
              <h1 class="display-title" tabindex="-1">Are you sure?</h1>
              <p class="body-lg">You can always explore other careers or retake the quiz later from your Dashboard.</p>
            </div>

            ${cardHtml}

            <div class="confirm-actions">
              <button type="button" class="btn-primary" id="launch-dashboard-btn">
                ${icon("rocket", 18)}
                <span>Yes, Launch My Dashboard</span>
              </button>
              <button type="button" class="btn-secondary" id="go-back-change-btn">
                ${icon("arrow-left", 18)}
                <span>Go Back &amp; Change</span>
              </button>
            </div>

            <button type="button" class="btn-link" id="restart-btn">
              ${icon("refresh", 16)}
              <span>Restart / Retest</span>
            </button>
          </div>
        </section>
      `;
    }

    function bindEvents() {
      const app = document.getElementById("app");

      if (state.step === 1) {
        app.querySelectorAll("[data-mode]").forEach(btn => {
          btn.addEventListener("click", () => {
            const mode = btn.getAttribute("data-mode");
            if (mode !== state.authMode) {
              state.authMode = mode;
              ui.errors = { name: "", identifier: "", password: "" };
              render(false);
            }
          });
        });

        const nameInput = document.getElementById("input-name");
        const idInput = document.getElementById("input-identifier");
        const pwInput = document.getElementById("input-password");

        if (nameInput) {
          nameInput.addEventListener("input", e => {
            ui.draftName = e.target.value;
            if (ui.errors.name) {
              ui.errors.name = "";
              const errEl = document.getElementById("err-name");
              if (errEl) errEl.innerHTML = "";
            }
          });
        }

        if (idInput) {
          idInput.addEventListener("input", e => {
            ui.draftIdentifier = e.target.value;
            if (ui.errors.identifier) {
              ui.errors.identifier = "";
              const errEl = document.getElementById("err-identifier");
              if (errEl) errEl.innerHTML = "";
            }
          });
        }

        if (pwInput) {
          pwInput.addEventListener("input", e => {
            ui.draftPassword = e.target.value;
            if (ui.errors.password) {
              ui.errors.password = "";
              const errEl = document.getElementById("err-password");
              if (errEl) errEl.innerHTML = "";
            }
          });
        }

        const togglePw = document.getElementById("toggle-pw");
        if (togglePw) {
          togglePw.addEventListener("click", () => {
            ui.showPassword = !ui.showPassword;
            render(false);
            const refreshedPw = document.getElementById("input-password");
            if (refreshedPw) refreshedPw.focus();
          });
        }

        const form = document.getElementById("auth-form");
        if (form) {
          form.addEventListener("submit", e => {
            e.preventDefault();
            const isReg = state.authMode === "register";
            const nameVal = ui.draftName.trim();
            const idVal = ui.draftIdentifier.trim();
            const pwVal = ui.draftPassword;

            const errors = { name: "", identifier: "", password: "" };
            let hasErr = false;

            if (isReg && nameVal.length < 2) {
              errors.name = "Please enter your full name.";
              hasErr = true;
            }
            if (idVal.length < 3) {
              errors.identifier = "Enter your email or a username (min. 3 characters).";
              hasErr = true;
            }
            if (pwVal.length < 6) {
              errors.password = "Password must be at least 6 characters.";
              hasErr = true;
            }

            ui.errors = errors;
            if (hasErr) {
              render(false);
              return;
            }

            let resolvedName = nameVal;
            if (!isReg) {
              const prefix = idVal.split("@")[0].replace(/[._-]+/g, " ").trim();
              resolvedName = prefix
                ? prefix.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
                : "Student";
            }

            state.user = { name: resolvedName, identifier: idVal };
            goToStep(2);
          });
        }

        const demoBtn = document.getElementById("demo-student-btn");
        if (demoBtn) {
          demoBtn.addEventListener("click", () => {
            state.user = { name: "Alex Rivera", identifier: "alex.rivera" };
            state.level = "Form 4–5";
            state.subjects = ["Mathematics", "Computing & Tech"];
            state.quizSkipped = false;
            state.chosenCareer = null;
            goToStep(3);
          });
        }
      }

      if (state.step === 2) {
        app.querySelectorAll("[data-level]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.level = btn.getAttribute("data-level");
            render(false);
          });
        });

        app.querySelectorAll("[data-subject]").forEach(btn => {
          btn.addEventListener("click", () => {
            const subj = btn.getAttribute("data-subject");
            const idx = state.subjects.indexOf(subj);
            if (idx > -1) {
              state.subjects.splice(idx, 1);
              ui.maxSubjectHint = false;
              render(false);
            } else if (state.subjects.length < 3) {
              state.subjects.push(subj);
              ui.maxSubjectHint = false;
              render(false);
            } else {
              ui.maxSubjectHint = true;
              render(false);
            }
          });
        });

        document.getElementById("step2-back").addEventListener("click", () => goToStep(1));
        document.getElementById("step2-next").addEventListener("click", () => {
          if (state.level && state.subjects.length >= 2) {
            goToStep(3);
          }
        });
      }

      if (state.step === 3) {
        document.getElementById("start-quiz-btn").addEventListener("click", () => {
          state.quizSkipped = false;
          state.quizIndex = 0;
          goToStep(4);
        });

        document.getElementById("skip-quiz-btn").addEventListener("click", () => {
          state.quizSkipped = true;
          state.chosenCareer = null;
          goToStep("done");
        });

        document.getElementById("step3-back").addEventListener("click", () => goToStep(2));
      }

      if (state.step === 4 && !ui.matching) {
        const optionButtons = Array.from(app.querySelectorAll("[data-opt]"));
        optionButtons.forEach((btn, idx) => {
          btn.addEventListener("click", () => {
            state.answers[state.quizIndex] = idx;
            render(false);
            const refreshedBtns = app.querySelectorAll("[data-opt]");
            if (refreshedBtns[idx]) refreshedBtns[idx].focus();
          });

          btn.addEventListener("keydown", e => {
            if (e.key === "ArrowRight" || e.key === "ArrowDown") {
              e.preventDefault();
              const nextIdx = (idx + 1) % optionButtons.length;
              state.answers[state.quizIndex] = nextIdx;
              render(false);
              const refreshedBtns = app.querySelectorAll("[data-opt]");
              if (refreshedBtns[nextIdx]) refreshedBtns[nextIdx].focus();
            } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
              e.preventDefault();
              const prevIdx = (idx - 1 + optionButtons.length) % optionButtons.length;
              state.answers[state.quizIndex] = prevIdx;
              render(false);
              const refreshedBtns = app.querySelectorAll("[data-opt]");
              if (refreshedBtns[prevIdx]) refreshedBtns[prevIdx].focus();
            }
          });
        });

        document.getElementById("quiz-back").addEventListener("click", () => {
          if (state.quizIndex > 0) {
            state.quizIndex -= 1;
            render(true);
          } else {
            goToStep(3);
          }
        });

        document.getElementById("quiz-next").addEventListener("click", () => {
          if (state.answers[state.quizIndex] === null) return;
          if (state.quizIndex < 7) {
            state.quizIndex += 1;
            render(true);
          } else {
            computeResults();
            ui.matching = true;
            render(true);
            if (matchTimer) clearTimeout(matchTimer);
            matchTimer = setTimeout(() => {
              ui.matching = false;
              goToStep(5);
            }, 1400);
          }
        });
      }

      if (state.step === 5) {
        app.querySelectorAll("[data-choose-career]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-choose-career");
            const picked = state.results.find(c => c.id === id);
            if (picked) {
              state.chosenCareer = { ...picked };
              state.quizSkipped = false;
              goToStep("done");
            }
          });
        });

        document.getElementById("retake-quiz-btn").addEventListener("click", () => {
          state.answers = Array(8).fill(null);
          state.traits = { AN: 0, CR: 0, SO: 0, BU: 0, EN: 0 };
          state.quizIndex = 0;
          state.results = [];
          state.chosenCareer = null;
          goToStep(4);
        });
      }

      if (state.step === "done") {
        document.getElementById("launch-dashboard-btn").addEventListener("click", () => {
          showToast("Dashboard handoff point: connect this button to the real DreamPath Dashboard.");
        });

        document.getElementById("go-back-change-btn").addEventListener("click", () => {
          if (state.chosenCareer && !state.quizSkipped && state.results.length) {
            goToStep(5);
          } else {
            goToStep(3);
          }
        });

        document.getElementById("restart-btn").addEventListener("click", () => {
          if (matchTimer) clearTimeout(matchTimer);
          state.step = 1;
          state.authMode = "register";
          state.user = { name: "", identifier: "" };
          state.level = "";
          state.subjects = [];
          state.quizIndex = 0;
          state.answers = Array(8).fill(null);
          state.traits = { AN: 0, CR: 0, SO: 0, BU: 0, EN: 0 };
          state.results = [];
          state.chosenCareer = null;
          state.quizSkipped = false;

          ui.draftName = "";
          ui.draftIdentifier = "";
          ui.draftPassword = "";
          ui.showPassword = false;
          ui.errors = { name: "", identifier: "", password: "" };
          ui.maxSubjectHint = false;
          ui.matching = false;

          render(true);
        });
      }
    }

    function render(isStepTransition = false) {
      renderTopbar();
      const app = document.getElementById("app");

      let html = "";
      if (state.step === 1) html = renderStep1();
      else if (state.step === 2) html = renderStep2();
      else if (state.step === 3) html = renderStep3();
      else if (state.step === 4) html = renderStep4();
      else if (state.step === 5) html = renderStep5();
      else if (state.step === "done") html = renderDone();

      app.innerHTML = html;
      bindEvents();

      if (isStepTransition) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        const heading = app.querySelector("h1");
        if (heading) {
          heading.focus({ preventScroll: true });
        }
      }
    }

    render(false);
  </script>
</body>
</html>
